<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity-Dashboard</title>
    <link rel="shortcut icon" href="./favicon-32x32.png" sizes="96x96" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <nav></nav>
      <section class="allElems">
        <div class="todo elem" id="0">
          <img src="https://images.unsplash.com/photo-1760753145427-c327d09ace00?q=80&w=1964&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" />
          <h2>To do List</h2>
        </div>
        <div class="daily elem" id="1">
          <img src="https://images.unsplash.com/photo-1648843707968-e364a7663260?q=80&w=2123&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" />
          <h2>daily Planner</h2>
        </div>
        <div class="moti elem" id="2">
          <img src="https://images.unsplash.com/photo-1710244182004-1c708b3f146d?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" />
          <h2>motivation</h2>
        </div>
        <div class="pomo elem" id="3">
          <img src="https://images.unsplash.com/photo-1734024653249-c6ba7b742ad2?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" />
          <h2>pomodoro</h2>
        </div>
        <div class="goals elem" id="4">
          <img src="https://plus.unsplash.com/premium_photo-1672595604620-697cf9584fda?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" />
          <h2>daily goals</h2>
        </div>
      </section>

      <section class="fullElem">
        <div class="content">
          <h2>to do list</h2>
          <button class="back-btn" id="0">close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="content">
          <h2>daily planner</h2>
          <button class="back-btn" id="1">close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="content">
          <h2>motivation quote</h2>
          <button class="back-btn" id="2">close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="content">
          <h2>pomodoro timer</h2>
          <button class="back-btn" id="3">close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="content">
          <h2>daily goals</h2>
          <button class="back-btn" id="4">close</button>
        </div>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
